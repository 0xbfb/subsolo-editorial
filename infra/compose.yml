name: ${COMPOSE_PROJECT_NAME:-subsolo}

services:
  postgres:
    image: postgres:17.10-alpine3.24
    profiles: ['core']
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subsolo_n8n}
      POSTGRES_USER: ${POSTGRES_USER:-subsolo_n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em infra/env/.env}
      TZ: ${SUBSOLO_TIMEZONE:-America/Sao_Paulo}
      PGTZ: ${SUBSOLO_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.29.10
    profiles: ['core']
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-subsolo_n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-subsolo_n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em infra/env/.env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY em infra/env/.env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_HOST_PORT:-5678}
      WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5678}/
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE_HOURS:-336}
      GENERIC_TIMEZONE: ${SUBSOLO_TIMEZONE:-America/Sao_Paulo}
      TZ: ${SUBSOLO_TIMEZONE:-America/Sao_Paulo}
      SUBSOLO_FRESHRSS_API_URL: ${SUBSOLO_FRESHRSS_API_URL:-http://freshrss/api/greader.php}
      SUBSOLO_FRESHRSS_API_USER: ${SUBSOLO_FRESHRSS_API_USER:-}
      SUBSOLO_FRESHRSS_API_PASSWORD: ${SUBSOLO_FRESHRSS_API_PASSWORD:-}
      SUBSOLO_FRESHRSS_AUTH_TOKEN: ${SUBSOLO_FRESHRSS_AUTH_TOKEN:-}
      SUBSOLO_SEARXNG_URL: ${SUBSOLO_SEARXNG_URL:-http://searxng:8080}
      SUBSOLO_GMAIL_READONLY_TOKEN: ${SUBSOLO_GMAIL_READONLY_TOKEN:-}
      SUBSOLO_GMAIL_QUERY: ${SUBSOLO_GMAIL_QUERY:-label:SUBSOLO/Pautas newer_than:2d}
      SUBSOLO_GOOGLE_SPREADSHEET_ID: ${SUBSOLO_GOOGLE_SPREADSHEET_ID:-}
      SUBSOLO_GOOGLE_SHEETS_WRITE_ACCESS_TOKEN: ${SUBSOLO_GOOGLE_SHEETS_WRITE_ACCESS_TOKEN:-}
      SUBSOLO_INGESTION_POLICY_FILE: ${SUBSOLO_INGESTION_POLICY_FILE:-/workspace/.runtime/config/ingestion-policy.json}
      SUBSOLO_INGESTION_STATE: ${SUBSOLO_INGESTION_STATE:-/workspace/.runtime/editorial/pitches.json}
      SUBSOLO_NTFY_URL: ${SUBSOLO_NTFY_URL:-http://ntfy}
      SUBSOLO_NTFY_TOPIC: ${SUBSOLO_NTFY_TOPIC:-}
      SUBSOLO_NTFY_TOKEN: ${SUBSOLO_NTFY_TOKEN:-}
    ports:
      - '127.0.0.1:${N8N_HOST_PORT:-5678}:5678'
    volumes:
      - n8n_data:/home/node/.n8n
      - ../:/workspace:ro
      - subsolo_runtime:/workspace/.runtime
    networks:
      - backend
      - outbound
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:5678/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  freshrss:
    image: freshrss/freshrss:1.29.1
    profiles: ['core']
    restart: unless-stopped
    environment:
      TZ: ${SUBSOLO_TIMEZONE:-America/Sao_Paulo}
      CRON_MIN: ${FRESHRSS_CRON_MIN:-13,43}
    ports:
      - '127.0.0.1:${FRESHRSS_HOST_PORT:-8080}:80'
    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions
    networks:
      - outbound
    healthcheck:
      test: ['CMD-SHELL', 'php -r ''$$s=@fsockopen("127.0.0.1",80); exit($$s?0:1);''']
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  searxng:
    image: ghcr.io/searxng/searxng:2026.5.10-df1f24fb7
    profiles: ['core']
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_HOST_PORT:-8081}/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Defina SEARXNG_SECRET em infra/env/.env}
      TZ: ${SUBSOLO_TIMEZONE:-America/Sao_Paulo}
    ports:
      - '127.0.0.1:${SEARXNG_HOST_PORT:-8081}:8080'
    volumes:
      - ./searxng/settings.runtime.yml:/etc/searxng/settings.yml:ro
      - searxng_data:/var/cache/searxng
    networks:
      - outbound
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8080/'', timeout=3)"',
        ]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  uptime-kuma:
    image: louislam/uptime-kuma:2.3.2
    profiles: ['core']
    restart: unless-stopped
    ports:
      - '127.0.0.1:${UPTIME_KUMA_HOST_PORT:-3001}:3001'
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - backend
      - outbound
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3001/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  ntfy:
    image: binwiederhier/ntfy:v2.23.0
    profiles: ['alerts']
    restart: unless-stopped
    command: ['serve']
    environment:
      TZ: ${SUBSOLO_TIMEZONE:-America/Sao_Paulo}
      NTFY_BASE_URL: http://localhost:${NTFY_HOST_PORT:-8082}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: 'true'
    ports:
      - '127.0.0.1:${NTFY_HOST_PORT:-8082}:80'
    volumes:
      - ntfy_data:/var/lib/ntfy
    networks:
      - outbound
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:80/v1/health || exit 1']
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge
    internal: true
  outbound:
    driver: bridge

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-subsolo}_postgres_data
  n8n_data:
    name: ${COMPOSE_PROJECT_NAME:-subsolo}_n8n_data
  freshrss_data:
    name: ${COMPOSE_PROJECT_NAME:-subsolo}_freshrss_data
  freshrss_extensions:
    name: ${COMPOSE_PROJECT_NAME:-subsolo}_freshrss_extensions
  searxng_data:
    name: ${COMPOSE_PROJECT_NAME:-subsolo}_searxng_data
  uptime_kuma_data:
    name: ${COMPOSE_PROJECT_NAME:-subsolo}_uptime_kuma_data
  ntfy_data:
    name: ${COMPOSE_PROJECT_NAME:-subsolo}_ntfy_data

  subsolo_runtime:
    name: ${COMPOSE_PROJECT_NAME:-subsolo}_runtime
